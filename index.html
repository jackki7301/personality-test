<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>나만의 정밀 성향 분석 테스트 (10문항)</title>
    <style>
        * { box-sizing: border-box; }

        body {
            font-family: '맑은 고딕', 'Malgun Gothic', sans-serif;
            background-color: #1a1a2e;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            overflow-x: hidden;
            position: relative;
        }

        /* 화면 전체를 채우는 듀얼 크로스페이드 AI 배경 레이어 */
        .bg-layer {
            position: fixed;
            top: -3%;
            left: -3%;
            width: 106%;
            height: 106%;
            background-size: cover;
            background-position: center;
            transition: opacity 0.6s ease, transform 6s ease;
            z-index: -2;
            opacity: 0;
            transform: scale(1);
        }
        .bg-layer.active {
            opacity: 1;
            transform: scale(1.04);
        }

        /* 배경 위 가독성을 높여주는 반투명 어두운 필터 */
        .bg-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at center, rgba(15, 23, 42, 0.3) 0%, rgba(15, 23, 42, 0.68) 100%);
            z-index: -1;
            pointer-events: none;
        }

        /* 폭죽(컨페티) 효과용 캔버스 */
        #confetti-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 999;
        }

        /* 메인 카드 컨테이너 */
        .container {
            background-color: rgba(255, 255, 255, 0.94);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: 32px 28px;
            border-radius: 26px;
            box-shadow: 0 20px 45px rgba(0, 0, 0, 0.35);
            border: 1px solid rgba(255, 255, 255, 0.65);
            width: 100%;
            max-width: 470px;
            text-align: center;
            position: relative;
            animation: cardAppear 0.5s ease;
        }

        @keyframes cardAppear {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* 우측 상단 효과음 On/Off 버튼 */
        .sound-toggle {
            position: absolute;
            top: 16px;
            right: 16px;
            background: rgba(241, 243, 245, 0.9);
            border: none;
            border-radius: 50%;
            width: 36px;
            height: 36px;
            font-size: 16px;
            cursor: pointer;
            transition: 0.2s;
            z-index: 10;
        }
        .sound-toggle:hover { background: #e9ecef; transform: scale(1.1); }

        .fade-slide { animation: slideIn 0.38s ease forwards; }
        @keyframes slideIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-8px); }
            50% { transform: translateX(8px); }
            75% { transform: translateX(-6px); }
        }
        .shake { animation: shake 0.35s ease; border-color: #ff5252 !important; }

        /* 시작 화면 스타일 */
        .start-banner {
            width: 100%;
            height: 150px;
            border-radius: 16px;
            object-fit: cover;
            margin-bottom: 18px;
            box-shadow: 0 6px 16px rgba(0,0,0,0.12);
        }
        .badge {
            display: inline-block;
            background: #ede7f6;
            color: #5e35b1;
            font-size: 13px;
            font-weight: bold;
            padding: 5px 14px;
            border-radius: 20px;
            margin-bottom: 10px;
        }
        h1 { font-size: 24px; color: #222; margin: 0 0 8px 0; }
        .subtitle { font-size: 14px; color: #555; margin-bottom: 20px; line-height: 1.5; }

        .name-input {
            width: 100%;
            padding: 14px 16px;
            font-size: 16px;
            border: 2px solid #dee2e6;
            border-radius: 12px;
            margin-bottom: 14px;
            text-align: center;
            outline: none;
            transition: border-color 0.25s, box-shadow 0.25s;
        }
        .name-input:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 4px rgba(102, 126, 234, 0.18);
        }

        /* 진행률 바 */
        .progress-wrapper { margin-bottom: 16px; padding-right: 36px; }
        .progress-info {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            font-weight: bold;
            color: #555;
            margin-bottom: 5px;
        }
        .progress-track {
            width: 100%;
            height: 8px;
            background-color: #e9ecef;
            border-radius: 10px;
            overflow: hidden;
        }
        .progress-fill {
            height: 100%;
            width: 10%;
            background: linear-gradient(90deg, #4CAF50, #2196F3);
            border-radius: 10px;
            transition: width 0.35s ease;
        }

        /* 상황별 AI 이미지 프리뷰 카드 */
        .scene-frame {
            position: relative;
            width: 100%;
            height: 155px;
            border-radius: 16px;
            overflow: hidden;
            margin-bottom: 16px;
            box-shadow: 0 6px 16px rgba(0, 0, 0, 0.15);
            background: #222;
        }
        .scene-frame img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s ease, opacity 0.3s ease;
        }
        .scene-frame:hover img {
            transform: scale(1.06);
        }
        .scene-caption {
            position: absolute;
            bottom: 10px;
            left: 10px;
            background: rgba(15, 23, 42, 0.75);
            color: #fff;
            font-size: 12px;
            font-weight: bold;
            padding: 5px 12px;
            border-radius: 20px;
            backdrop-filter: blur(4px);
        }

        /* 질문 텍스트 박스 */
        #question-text {
            font-size: 17.5px;
            font-weight: bold;
            margin-bottom: 18px;
            color: #1e293b;
            word-break: keep-all;
            line-height: 1.5;
            padding: 13px 12px;
            border-radius: 12px;
            background: rgba(241, 245, 249, 0.85);
            cursor: pointer;
            transition: background-color 0.25s, transform 0.25s;
        }
        #question-text:hover {
            background: rgba(224, 242, 254, 0.95);
            transform: translateY(-2px);
        }

        /* 선택지 버튼 + 호버 확대 및 색상 변경 효과 */
        .btn {
            display: block;
            width: 100%;
            padding: 15px 14px;
            margin-bottom: 12px;
            border: none;
            border-radius: 12px;
            background-color: #4CAF50;
            color: white;
            font-size: 14.5px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.25s ease, background-color 0.25s ease, box-shadow 0.25s ease;
            word-break: keep-all;
            line-height: 1.4;
        }
        .btn:hover {
            transform: scale(1.05);
            background-color: #2196F3;
            box-shadow: 0 8px 20px rgba(33, 150, 243, 0.4);
        }
        .btn:active { transform: scale(0.98); }

        .start-btn { background: linear-gradient(90deg, #667eea, #764ba2); margin-bottom: 0; font-size: 16px; }
        .start-btn:hover {
            background: linear-gradient(90deg, #5a6fd6, #6a3f96);
            box-shadow: 0 8px 20px rgba(118, 75, 162, 0.45);
        }

        /* 로딩 화면 */
        #loading-screen { display: none; padding: 40px 0; }
        .spinner {
            width: 54px;
            height: 54px;
            border: 6px solid #e9ecef;
            border-top: 6px solid #667eea;
            border-radius: 50%;
            margin: 0 auto 20px auto;
            animation: spin 0.9s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        #loading-text { font-size: 17px; font-weight: bold; color: #333; }

        /* 결과 화면 */
        #test-screen, #result-screen { display: none; }
        .user-greeting {
            font-size: 14px;
            font-weight: bold;
            color: #5e35b1;
            margin-bottom: 10px;
        }
        #result-image {
            width: 100%;
            height: 165px;
            margin: 0 auto 14px auto;
            display: block;
            border-radius: 16px;
            object-fit: cover;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.16);
            animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        @keyframes popIn {
            0% { transform: scale(0.9); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
        .result-title { font-size: 23px; font-weight: bold; color: #1e88e5; margin-bottom: 8px; }
        #result-desc {
            font-size: 14.5px;
            color: #444;
            margin-bottom: 18px;
            line-height: 1.5;
            word-break: keep-all;
        }

        /* 성향 비율 게이지 바 */
        .ratio-box {
            background: rgba(248, 249, 250, 0.9);
            padding: 12px 14px;
            border-radius: 12px;
            margin-bottom: 14px;
        }
        .ratio-labels {
            display: flex;
            justify-content: space-between;
            font-size: 12.5px;
            font-weight: bold;
            margin-bottom: 6px;
        }
        .label-a { color: #1e88e5; }
        .label-b { color: #f57c00; }
        .ratio-bar {
            display: flex;
            height: 11px;
            border-radius: 8px;
            overflow: hidden;
            background: #e9ecef;
        }
        #bar-a { background: #2196F3; transition: width 0.8s ease; }
        #bar-b { background: #FF9800; transition: width 0.8s ease; }

        /* 궁합 카드 */
        .match-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 18px;
        }
        .match-card {
            background: rgba(248, 249, 250, 0.9);
            border-radius: 12px;
            padding: 10px 8px;
            border: 1px solid #e2e8f0;
        }
        .match-label { font-size: 11.5px; color: #64748b; margin-bottom: 3px; }
        .match-value { font-size: 13.5px; font-weight: bold; color: #1e293b; }

        .reset-btn { background-color: #ff9800; margin-bottom: 0; font-size: 16px; }
        .reset-btn:hover {
            background-color: #e65100;
            box-shadow: 0 8px 18px rgba(230, 81, 0, 0.35);
        }
    </style>
</head>
<body>

    <!-- 듀얼 풀스크린 AI 배경 레이어 -->
    <div id="bg-layer-1" class="bg-layer active"></div>
    <div id="bg-layer-2" class="bg-layer"></div>
    <div class="bg-overlay"></div>

    <!-- 폭죽 효과 캔버스 -->
    <canvas id="confetti-canvas"></canvas>

    <div class="container">
        <button class="sound-toggle" id="sound-btn" onclick="toggleSound()" title="효과음 켜기/끄기">🔊</button>

        <!-- 1. 시작 화면 -->
        <div id="start-screen" class="fade-slide">
            <img id="start-img" class="start-banner" src="" alt="시작 배경">
            <div class="badge">✨ 10문항 정밀 AI 성향 분석</div>
            <h1>🧠 나의 진짜 성향 테스트</h1>
            <p class="subtitle">10가지 상황 질문과 선택지에 마우스를 올려보세요!<br>각 상황에 맞는 AI 일러스트 배경과 함께 성향을 분석합니다.</p>
            <input type="text" id="username-input" class="name-input" placeholder="이름 또는 닉네임을 입력하세요" maxlength="12" onkeypress="if(event.key==='Enter') startTest()">
            <button class="btn start-btn" onclick="startTest()">테스트 시작하기 🚀</button>
        </div>

        <!-- 2. 질문 진행 화면 -->
        <div id="test-screen">
            <div class="progress-wrapper">
                <div class="progress-info">
                    <span id="progress-step">질문 1 / 10</span>
                    <span id="progress-percent">10%</span>
                </div>
                <div class="progress-track">
                    <div class="progress-fill" id="progress-fill"></div>
                </div>
            </div>

            <!-- 실시간 상황 일러스트 배너 -->
            <div class="scene-frame">
                <img id="scene-preview" src="" alt="상황 배경 이미지">
                <div class="scene-caption" id="scene-caption">🖼️ 상황 배경</div>
            </div>

            <div id="question-box" class="fade-slide">
                <div id="question-text" onmouseenter="previewScene('base')">질문이 여기에 표시됩니다.</div>
                <button class="btn" id="btn1" onmouseenter="previewScene('opt1')" onmouseleave="previewScene('base')" onclick="selectAnswer(1)">옵션 1</button>
                <button class="btn" id="btn2" onmouseenter="previewScene('opt2')" onmouseleave="previewScene('base')" onclick="selectAnswer(2)">옵션 2</button>
            </div>
        </div>

        <!-- 3. 로딩 화면 -->
        <div id="loading-screen" class="fade-slide">
            <div class="spinner"></div>
            <div id="loading-text">10가지 답변 데이터를 정밀 분석 중...</div>
        </div>

        <!-- 4. 최종 결과 화면 -->
        <div id="result-screen" class="fade-slide">
            <div class="user-greeting" id="user-greeting">OO님의 성향 분석 결과</div>
            <img id="result-image" src="" alt="성향 결과 이미지">
            <div class="result-title" id="result-title">결과 타이틀</div>
            <div id="result-desc">결과 상세 설명</div>

            <div class="ratio-box">
                <div class="ratio-labels">
                    <span class="label-a" id="ratio-label-a">신중·계획 0%</span>
                    <span class="label-b" id="ratio-label-b">활동·즉흥 0%</span>
                </div>
                <div class="ratio-bar">
                    <div id="bar-a" style="width: 50%;"></div>
                    <div id="bar-b" style="width: 50%;"></div>
                </div>
            </div>

            <div class="match-grid">
                <div class="match-card">
                    <div class="match-label">💖 환상의 짝꿍</div>
                    <div class="match-value" id="best-match">-</div>
                </div>
                <div class="match-card">
                    <div class="match-label">⚡ 주의할 유형</div>
                    <div class="match-value" id="worst-match">-</div>
                </div>
            </div>

            <button class="btn reset-btn" onclick="resetTest()">다시 테스트하기 🔄</button>
        </div>
    </div>

    <script>
        // 31종 고화질 AI 일러스트 스타일 SVG 배경 라이브러리

            // Q2: 친구의 새 옷
            q2_base: `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450">
                <defs><linearGradient id="gQ2" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#fdf2f8"/><stop offset="100%" stop-color="#e0e7ff"/></linearGradient></defs>

                <polygon points="400,140 355,300 445,300" fill="#818cf8"/>

            </svg>`,
            q2_direct: `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450">
                <defs><linearGradient id="gDir" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#0f172a"/><stop offset="100%" stop-color="#1e3a8a"/></linearGradient></defs>

                <polygon points="400,90 490,225 400,360 310,225" fill="#0ea5e9" stroke="#e0f2fe" stroke-width="5"/>

                <line x1="530" y1="225" x2="680" y2="225" stroke="#38bdf8" stroke-width="4" stroke-dasharray="12 8"/>
            </svg>`,
            q2_soft: `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450">
                <defs><linearGradient id="gSoft" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#ffedd5"/><stop offset="50%" stop-color="#fbcfe8"/><stop offset="100%" stop-color="#f472b6"/></linearGradient></defs>
                <rect width="800" height="450" fill="url(#gSoft)"/>
                <circle cx="400" cy="225" r="150" fill="#fff" opacity="0.35"/>
                <path d="M400 285 C320 225 320 155 370 155 C390 155 400 172 400 172 C400 172 410 155 430 155 C480 155 480 225 400 285 Z" fill="#f43f5e"/>
                <circle cx="220" cy="140" r="14" fill="#fff" opacity="0.7"/><circle cx="590" cy="160" r="18" fill="#fff" opacity="0.7"/>
            </svg>`,

                    opt1: { svg: aiScenes.q4_plan, label: "📊 선택 1: 체계적인 데이터 분석과 기획" },
                    opt2: { svg: aiScenes.q4_lead, label: "💡 선택 2: 열정적인 발표와 분위기 리드" }
                }
            },
            {
                q: "5. 새로 오픈한 인기 맛집 앞에 줄이 엄청나게 길다! 나의 선택은?",
                opt1: "(1) 미리 리뷰를 찾아보고 예약 가능한 다른 검증된 식당으로 간다",
                opt2: "(2) \"일단 기다려보자!\" 설레는 마음으로 줄을 서서 도전한다",
                scenes: {
                    base: { svg: aiScenes.q5_base, label: "🖼️ 상황: 긴 줄이 늘어선 화제의 맛집 앞" },
                    opt1: { svg: aiScenes.q5_safe, label: "🍽️ 선택 1: 조용하고 검증된 예약 레스토랑" },
                    opt2: { svg: aiScenes.q5_wait, label: "🔥 선택 2: 활기찬 인기 맛집 웨이팅 도전" }
                }
            },
            {
                q: "6. 갑자기 예상치 못한 10만 원의 용돈이 생겼다! 어떻게 쓸까?",
                opt1: "(1) 비상금 통장에 저축하거나 꼭 필요했던 물건을 신중히 구매한다",
                opt2: "(2) 오늘 기분이다! 친구들과 맛있는 걸 먹거나 바로 쇼핑하러 간다",
                scenes: {
                    base: { svg: aiScenes.q6_base,  label: "🖼️ 상황: 뜻밖의 보너스 10만 원 획득" },
                    opt1: { svg: aiScenes.q6_save,  label: "🔐 선택 1: 미래를 위한 든든한 저축과 계획 소비" },
                    opt2: { svg: aiScenes.q6_spend, label: "🛍️ 선택 2: 지금 이 순간을 즐기는 플렉스 쇼핑" }
                }
            },
            {
                q: "7. 시험이나 중요한 발표를 일주일 앞둔 나의 준비 스타일은?",
                opt1: "(1) 날짜별 계획표를 세워 매일 정해진 분량만큼 차근차근 준비한다",
                opt2: "(2) 막판 집중력이 최고! 벼락치기 에너지로 한 번에 몰입해서 끝낸다",
                scenes: {
                    base: { svg: aiScenes.q7_base, label: "🖼️ 상황: D-7 시험과 발표 카운트다운" },
                    opt1: { svg: aiScenes.q7_step, label: "📚 선택 1: 매일 한 계단씩 쌓아 올리는 계획형" },
                    opt2: { svg: aiScenes.q7_rush, label: "⚡ 선택 2: 밤샘 초인적 몰입의 벼락치기형" }
                }
            },
            {
                q: "8. 처음 보는 사람들이 많은 모임이나 파티에 초대받았다!",
                opt1: "(1) 조용히 분위기를 살피며 마음 맞는 한두 명과 깊은 대화를 나눈다",
                opt2: "(2) 먼저 다가가 인사를 건네며 금세 여러 사람과 어울려 웃고 떠든다",
                scenes: {
                    base: { svg: aiScenes.q8_base,  label: "🖼️ 상황: 낯선 사람들로 가득한 파티 라운지" },
                    opt1: { svg: aiScenes.q8_deep,  label: "☕ 선택 1: 차분하고 깊이 있는 1:1 대화" },
                    opt2: { svg: aiScenes.q8_party, label: "🪩 선택 2: 모두와 어울리는 파티의 인싸 에너지" }
                }
            },
            {
                q: "9. 스마트폰 배터리가 5%밖에 남지 않았는데 보조배터리가 없다!",
                opt1: "(1) 절전 모드를 켜고 꼭 필요한 연락만 남긴 채 충전할 곳을 찾는다",
                opt2: "(2) \"꺼지면 어때~\" 오히려 디지털 디톡스라며 주변 풍경을 즐긴다",
                scenes: {
                    base: { svg: aiScenes.q9_base,    label: "🖼️ 상황: 빨간불이 들어온 배터리 5% 위기" },
                    opt1: { svg: aiScenes.q9_savebat, label: "🔋 선택 1: 철저한 배터리 관리와 충전소 탐색" },
                    opt2: { svg: aiScenes.q9_detox,   label: "🌅 선택 2: 스마트폰을 잊고 즐기는 자유로운 노을" }
                }
            },
            {
                q: "10. 하루를 마무리하며 잠들기 전, 머릿속에 주로 떠오르는 생각은?",
                opt1: "(1) 오늘 있었던 일을 차분히 되돌아보고 내일 할 일을 미리 정리한다",
                opt2: "(2) 내일은 또 어떤 재미있는 일이 생길까 기대하며 기분 좋게 잠든다",
                scenes: {
                    base: { svg: aiScenes.q10_base,  label: "🖼️ 상황: 고요한 밤, 잠들기 전 침대 위" },
                    opt1: { svg: aiScenes.q10_diary, label: "✒️ 선택 1: 하루를 성찰하고 내일을 설계하는 시간" },
                    opt2: { svg: aiScenes.q10_dream, label: "🌈 선택 2: 설레는 상상과 함께 떠나는 꿈나라 여행" }
                }
            }
        ];

        let userName = "";
        let currentIndex = 0;
        let scoreA = 0;
        let scoreB = 0;
        let soundEnabled = true;
        let audioCtx = null;
        let activeBgLayer = 1;
        let currentBgKey = "";

        // 풀스크린 배경 크로스페이드 전환
        function setFullscreenBackground(key, svgString) {
            if (currentBgKey === key) return;
            currentBgKey = key;

            const dataUri = `url("data:image/svg+xml;charset=utf-8,${encodeURIComponent(svgString)}")`;
            const layer1 = document.getElementById("bg-layer-1");
            const layer2 = document.getElementById("bg-layer-2");

            if (activeBgLayer === 1) {
                layer2.style.backgroundImage = dataUri;
                layer2.classList.add("active");
                layer1.classList.remove("active");
                activeBgLayer = 2;
            } else {
                layer1.style.backgroundImage = dataUri;
                layer1.classList.add("active");
                layer2.classList.remove("active");
                activeBgLayer = 1;
            }
        }

        // 질문 또는 선택지 버튼 호버 시 해당 상황 배경으로 즉시 전환
        function previewScene(type) {
            if (currentIndex >= questions.length) return;
            const sceneObj = questions[currentIndex].scenes[type];
            const dataUri = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(sceneObj.svg);

            document.getElementById("scene-preview").src = dataUri;
            document.getElementById("scene-caption").innerText = sceneObj.label;
            setFullscreenBackground(`q${currentIndex}_${type}`, sceneObj.svg);
        }

        // 효과음 시스템 (Web Audio API)
        function initAudio() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        function toggleSound() {
            soundEnabled = !soundEnabled;
            document.getElementById("sound-btn").innerText = soundEnabled ? "🔊" : "🔇";
        }
        function playPopSound() {
            if (!soundEnabled) return;
            initAudio();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = "sine";
            osc.frequency.setValueAtTime(520, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(880, audioCtx.currentTime + 0.09);
            gain.gain.setValueAtTime(0.16, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.09);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.09);
        }
        function playFanfareSound() {
            if (!soundEnabled) return;
            initAudio();
            const notes = [523.25, 659.25, 783.99, 1046.50];
            notes.forEach((freq, idx) => {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = "triangle";
                const startTime = audioCtx.currentTime + idx * 0.1;
                osc.frequency.setValueAtTime(freq, startTime);
                gain.gain.setValueAtTime(0.18, startTime);
                gain.gain.exponentialRampToValueAtTime(0.01, startTime + 0.35);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start(startTime);
                osc.stop(startTime + 0.35);
            });
        }

        window.onload = function() {
            const introUri = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(aiScenes.intro);
            document.getElementById("start-img").src = introUri;
            setFullscreenBackground("intro", aiScenes.intro);
        };

        function startTest() {
            const input = document.getElementById("username-input");
            const val = input.value.trim();
            if (!val) {
                input.classList.remove("shake");
                void input.offsetWidth;
                input.classList.add("shake");
                input.focus();
                return;
            }
            userName = val;
            playPopSound();
            document.getElementById("start-screen").style.display = "none";
            document.getElementById("test-screen").style.display = "block";
            showQuestion();
        }

        function showQuestion() {
            if (currentIndex < questions.length) {
                const currentQ = questions[currentIndex];
                const percent = Math.round(((currentIndex + 1) / questions.length) * 100);
                document.getElementById("progress-step").innerText = `질문 ${currentIndex + 1} / ${questions.length}`;
                document.getElementById("progress-percent").innerText = `${percent}%`;
                document.getElementById("progress-fill").style.width = `${percent}%`;

                const qBox = document.getElementById("question-box");
                qBox.classList.remove("fade-slide");
                void qBox.offsetWidth;
                qBox.classList.add("fade-slide");

                document.getElementById("question-text").innerText = currentQ.q;
                document.getElementById("btn1").innerText = currentQ.opt1;
                document.getElementById("btn2").innerText = currentQ.opt2;

                previewScene("base");
            } else {
                startLoading();
            }
        }

        function selectAnswer(choice) {
            playPopSound();
            if (choice === 1) scoreA += 1;
            else if (choice === 2) scoreB += 1;

            currentIndex += 1;
            showQuestion();
        }

        function startLoading() {
            document.getElementById("test-screen").style.display = "none";
            document.getElementById("loading-screen").style.display = "block";
            setFullscreenBackground("intro", aiScenes.intro);

            setTimeout(() => {
                document.getElementById("loading-text").innerText = `${userName}님의 10가지 선택을 종합하는 중...`;
            }, 750);

            setTimeout(() => {
                document.getElementById("loading-screen").style.display = "none";
                showResult();
            }, 1600);
        }

        function showResult() {
            document.getElementById("result-screen").style.display = "block";
            document.getElementById("user-greeting").innerText = `✨ ${userName}님의 정밀 성향 분석 결과 ✨`;

            const total = scoreA + scoreB || 1;
            const percentA = Math.round((scoreA / total) * 100);
            const percentB = 100 - percentA;

            document.getElementById("ratio-label-a").innerText = `신중·계획 ${percentA}% (${scoreA}개)`;
            document.getElementById("ratio-label-b").innerText = `활동·즉흥 ${percentB}% (${scoreB}개)`;
            document.getElementById("bar-a").style.width = `${percentA}%`;
            document.getElementById("bar-b").style.width = `${percentB}%`;

            const resultImg = document.getElementById("result-image");
            const resultTitle = document.getElementById("result-title");
            const resultDesc = document.getElementById("result-desc");
            const bestMatch = document.getElementById("best-match");
            const worstMatch = document.getElementById("worst-match");

            if (scoreA > scoreB) {
                setFullscreenBackground("res_plan", aiScenes.q3_plan);
                resultImg.src = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(aiScenes.q3_plan);
                resultTitle.innerText = "[신중한 탐구형]";
                resultDesc.innerText = "차분하게 생각하고 철저히 계획 세우는 걸 좋아하시는 스타일이네요! 어떤 상황에서도 흔들리지 않는 안정감과 신뢰를 주는 타입입니다.";
                bestMatch.innerText = "유연한 조화형";
                worstMatch.innerText = "활동적인 즉흥형";
            } else if (scoreB > scoreA) {
                setFullscreenBackground("res_free", aiScenes.q1_out);
                resultImg.src = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(aiScenes.q1_out);
                resultTitle.innerText = "[활동적인 즉흥형]";
                resultDesc.innerText = "에너지가 넘치고 그 순간의 직관을 즐기시는 스타일이네요! 새로운 도전을 두려워하지 않으며 주변 분위기를 밝게 만드는 매력이 있습니다.";
                bestMatch.innerText = "유연한 조화형";
                worstMatch.innerText = "신중한 탐구형";
            } else {
                setFullscreenBackground("res_soft", aiScenes.q10_dream);
                resultImg.src = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(aiScenes.q10_dream);
                resultTitle.innerText = "[유연한 조화형]";
                resultDesc.innerText = "10개 문항 중 5:5 황금 밸런스를 기록하셨네요! 상황에 맞춰 계획성과 즉흥성을 자유자재로 조율할 줄 아는 뛰어난 적응력의 소유자입니다.";
                bestMatch.innerText = "신중한 탐구형";
                worstMatch.innerText = "유연한 조화형";
            }

            playFanfareSound();
            launchConfetti();
        }

        function resetTest() {
            playPopSound();
            currentIndex = 0;
            scoreA = 0;
            scoreB = 0;
            document.getElementById("result-screen").style.display = "none";
            document.getElementById("start-screen").style.display = "block";
            setFullscreenBackground("intro", aiScenes.intro);
        }

        function launchConfetti() {
            const canvas = document.getElementById("confetti-canvas");
            const ctx = canvas.getContext("2d");
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;

            const colors = ["#ff5252", "#ffeb3b", "#4caf50", "#2196f3", "#e040fb", "#ff9800"];
            const particles = [];

            for (let i = 0; i < 120; i++) {
                particles.push({
                    x: canvas.width / 2,
                    y: canvas.height / 2 + 40,
                    vx: (Math.random() - 0.5) * 16,
                    vy: (Math.random() - 0.7) * 18,
                    size: Math.random() * 8 + 5,
                    color: colors[Math.floor(Math.random() * colors.length)],
                    rotation: Math.random() * 360,
                    vRot: (Math.random() - 0.5) * 12
                });
            }

            let frame = 0;
            function animate() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                particles.forEach(p => {
                    p.x += p.vx;
                    p.y += p.vy;
                    p.vy += 0.38;
                    p.rotation += p.vRot;

                    ctx.save();
                    ctx.translate(p.x, p.y);
                    ctx.rotate((p.rotation * Math.PI) / 180);
                    ctx.fillStyle = p.color;
                    ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size * 0.6);
                    ctx.restore();
                });

                frame++;
                if (frame < 130) {
                    requestAnimationFrame(animate);
                } else {
                    ctx.clearRect(0, 0, canvas.width, canvas.height);
                }
            }
            animate();
        }
    </script>
